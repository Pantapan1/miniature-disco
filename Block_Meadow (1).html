function defWorld(){

 return{v:1,motd:'Открытие луга!',
  items:[{id:'apple',n:'Яблоко',e:'🍎'},{id:'star',n:'Звезда скорости',e:'⭐'}],
  locs:{meadow:{n:'Луг',sx:10,sy:24,rows:m,portals:{'10,3':['grove',7,11]},objs:[{x:5,y:20,i:'apple'},{x:14,y:18,i:'apple'},{x:10,y:10,i:'star'}]},
        grove:{n:'Роща',sx:7,sy:10,rows:g,portals:{'7,12':['meadow',10,4]},objs:[{x:4,y:4,i:'apple'}]}},
  code:"function onJoin(p){ api.toast('Добро пожаловать, '+p.n+'!') }\nfunction onPickup(it){\n  api.toast('Подобрано: '+it.e+' '+it.n);\n  if(it.id=='star') api.speed(1.6)\n}\nfunction onTick(){}"};
}
const api={sound:id=>playSnd(id),music:id=>playMus(id),stopMusic:()=>stopMus(),anim:(n,ms,e)=>{const f=fdv();me.an={n,e,t:Date.now()+(ms||1000),tx:(Math.floor(me.x+f.x)+.5)*T,ty:(Math.floor(me.y+f.y)+.5)*T}},fx:e=>fx.push({e,x:me.x*T,y:me.y*T-40,t0:performance.now()}),after:(ms,fn)=>setTimeout(()=>{try{fn()}catch(e){toast(e.message)}},ms),facing:()=>tileAt(me.x+fdv().x,me.y+fdv().y),near:ch=>[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>tileAt(me.x+a,me.y+b)==ch),tile:(x,y)=>tileAt(x,y),has:id=>me.inv[id]|0,consume:id=>{id=id||me.sel;if(me.inv[id]>0){me.inv[id]--;if(!me.inv[id]){if(me.sel==id)me.sel='';updHand()}saveMe()}},island:()=>tp('isl'),place:ch=>{if(me.l!='isl'){toast('Строить можно на своём острове');return false}const f=fdv(),x=Math.floor(me.x+f.x),y=Math.floor(me.y+f.y),r=me.island.rows;if(y<1||x<1||y>=r.length-1||x>=r[0].length-1||me.island.portals[x+','+y])return false;r[y]=r[y].slice(0,x)+ch+r[y].slice(x+1);saveMe();return true},chest:()=>{if(me.l!='isl'){toast('Сундук ставится на острове');return false}const f=fdv();(me.island.objs=me.island.objs||[]).push({x:Math.floor(me.x+f.x),y:Math.floor(me.y+f.y),c:1,ch:{}});saveMe();return true},items:()=>world.items,coins:d=>{if(d===undefined)return me.coins|0;if((me.coins|0)+d<0){toast('Мало монет 🪙');return false}me.coins=(me.coins|0)+d;save('pm_me',me);$('#co').textContent=me.coins+'🪙';return true},toast,weather:id=>{world.wx.cur=id;world.wx.auto=0},speed:v=>sp=+v||1,say:t=>talk(String(t)),give:id=>give(id),tp:(l,x,y)=>tp(l,x,y),get me(){return{n:me.n,x:me.x,y:me.y,l:me.l}}};
function compile(){hooks={};try{hooks=new Function('api',world.code+';return{onJoin:typeof onJoin=="function"?onJoin:0,onPickup:typeof onPickup=="function"?onPickup:0,onTick:typeof onTick=="function"?onTick:0}')(api)}catch(e){toast('Ошибка скрипта: '+e.message)}}

function applyWorld(w,announce){
 const first=!world;world=w;w.tex=w.tex||{};w.snd=w.snd||{pick:{w:'square',f:660,f2:1320,d:.15,v:.2}};w.menu=w.menu||defMenu();w.tiles=w.tiles||defTiles();for(const k of 'ПКД')if(!w.tiles[k])w.tiles[k]=defTiles()[k];w.acc=w.acc||defAcc();w.faces=w.faces||defFaces();w.acts=w.acts||defActs();w.wx=w.wx||defWx();w.time=w.time||{m:'cycle',len:240,at:.5};if(!w.v2){w.v2=1;defItems().forEach(i=>{if(!w.items.find(a=>a.id==i.id))w.items.push(i)});w.items.forEach(i=>{if(i.id=='apple'&&!i.u)i.u="api.anim('eat',1200,item.e);api.consume();api.fx('😋')"});w.menu.push({t:'🏝 Мой остров',c:'api.island()'});const f0=Object.values(w.locs)[0];if(f0&&!(f0.objs||[]).some(o=>o.c))(f0.objs=f0.objs||[]).push({x:f0.sx+2,y:f0.sy-2,c:1,ch:{rod:1,chest:1,apple:3}})}w.mus=w.mus||{theme:defTheme()};if(w.bgm===undefined)w.bgm='theme';w.html=w.html||'';w.js=w.js||'';loadTex();if(me.l=='isl'?!me.island:!world.locs[me.l]){me.l=Object.keys(world.locs)[0];const L=world.locs[me.l];me.x=L.sx;me.y=L.sy}
 compile();try{runMods()}catch(e){toast('Ошибка мода: '+e.message);safeMode();return}good=JSON.stringify(world);$('#loc').textContent=L().n;

}
async function publish(){

/* ---------- игра ---------- */
const L=()=>me.l=='isl'?me.island:world.locs[me.l];
const tileAt=(x,y)=>{const r=L().rows[Math.floor(y)];return r?r[Math.floor(x)]:undefined};
const blocked=(x,y)=>{const c=tileAt(x,y);if(c===undefined)return true;const d=world.tiles[c];if(!d||!d.b)return false;if(!d.hb)return true;const fx=x%1,fy=y%1;return fx>=d.hb[0]&&fx<=d.hb[2]&&fy>=d.hb[1]&&fy<=d.hb[3]};

 if(m>.1){me.fd=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};const s=3.2*sp*dt/Math.max(m,1);const nx=me.x+dx*s,ny=me.y+dy*s;

  const k=Math.floor(me.x)+','+Math.floor(me.y),p=L().portals&&L().portals[k];if(p)tp(...p);
  const os=L().objs||[];for(let i=os.length-1;i>=0;i--){const o=os[i];if(!o.c&&Math.abs(o.x+.5-me.x)<.6&&Math.abs(o.y+.5-me.y)<.6&&!editing){const it=world.items.find(a=>a.id==o.i);os.splice(i,1);respawn(o);if(it){give(it.id);api.coins(1);playSnd('pick');hk('onPickup',it)}}}}
}

function pony(x,y,c,k,n,s,f,t,an,o){const e=an?an.n:'';if(e=='eat'||e=='jump')y-=Math.abs(Math.sin(t/110))*14;if(an){if(e=='fish'){cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.moveTo(x+30,y-30);cx.lineTo(an.tx,an.ty);cx.stroke();cx.font='34px sans-serif';cx.textAlign='center';cx.fillText('🎣',x+30,y-8)}else if(an.e){cx.font='28px sans-serif';cx.textAlign='center';cx.fillText(an.e,x,y-92-Math.abs(Math.sin(t/150))*8)}}
 cx.fillStyle='#0004';cx.fillRect(x-26,y+24,52,8);
 const im=k&&texOf(k,t);
 if(im)cx.drawImage(im,x-32,y-32,64,64);else{cx.fillStyle=c;cx.fillRect(x-26,y-26,52,52);cx.fillStyle='#0003';cx.fillRect(x-26,y+16,52,10);faceDraw(x,y,o&&o.e)}
 {const o2=o||{},ft=o2.e&&texOf('face_'+o2.e,t);if(ft)cx.drawImage(ft,x-32,y-32,64,64);const ac=o2.a&&world.acc&&world.acc.find(q=>q.id==o2.a);if(ac){const at=texOf('acc_'+ac.id,t);if(at)cx.drawImage(at,x-32,y-32,64,64);else{cx.font='34px sans-serif';cx.textAlign='center';cx.fillText(ac.e,x,y-24)}}}

}
function draw(t){

function renderWx(){tabbtn();const a=$('#admb'),w=world.wx,tm=world.time;if(WI<0||!w.list[WI])WI=Math.max(0,w.list.findIndex(x=>x.id==w.cur));const p=w.list[WI];

 const th=()=>$('#tmh').textContent=String(tm.at*24|0).padStart(2,'0')+':00';th();
 a.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{WI=+b.dataset.w;w.cur=w.list[WI].id;w.auto=0;renderWx()});

 bd('#wa',v=>w.auto=+v||0);bd('#tmm',v=>tm.m=v);bd('#tml',v=>tm.len=Math.max(30,+v||240));bd('#tma',v=>{tm.at=v/100;th()});
 bd('#pn',v=>p.n=v);bd('#pe',v=>p.e=v);bd('#pk',v=>p.k=v);bd('#pi',v=>p.i=v/100);bd('#pc',v=>p.tc=v);bd('#pa',v=>p.ta=v/100);
 $('#pnw').onclick=async()=>{const n=await ask('Название погоды');if(!n)return;w.list.push({id:'w'+Date.now().toString(36),n,e:'🌈',k:'none',i:.5,tc:'#000000',ta:0});WI=w.list.length-1;renderWx()};
 $('#pdl').onclick=()=>{if(w.list.length<2)return;const d=w.list.splice(WI,1)[0];if(w.cur==d.id)w.cur=w.list[0].id;WI=-1;renderWx()}}

(async()=>{

 $('#st').textContent=db?'Онлайн-режим':'Офлайн-режим (без других игроков)';
 pv();
