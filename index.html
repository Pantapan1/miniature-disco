let bdT=0;function bumpDoor(x,y){const c=tileAt(x,y),d=c&&world.tiles[c];if(!d||!d.key||doorOpen(0,x,y))return;if(me.inv[d.key]>0){me.op[me.l+':'+Math.floor(x)+','+Math.floor(y)]=1;api.consume(d.key);toast('🔓 Открыто!');playSnd('pick');saveMe()}else if(Date.now()-bdT>1500){bdT=Date.now();toast('🔒 Нужен ключ: '+nm(d.key))}}

function npcPos(n){if(!n.rt)return n;const P=[[n.x,n.y]].concat(String(n.rt).split(';').map(s=>s.split(',').map(Number)).filter(p=>p.length==2&&!isNaN(p[0])&&!isNaN(p[1])));if(P.length<2)return n;const S=[];let Lt=0;for(let i=1;i<P.length;i++){const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);S.push(d);Lt+=d}if(!Lt)return n;let d=(Date.now()/1000*1.1)%(2*Lt);if(d>Lt)d=2*Lt-d;for(let i=0;i<S.length;i++){if(d<=S[i]||i==S.length-1){const k=S[i]?Math.min(1,d/S[i]):0;return{x:P[i][0]+(P[i+1][0]-P[i][0])*k,y:P[i][1]+(P[i+1][1]-P[i][1])*k}}d-=S[i]}return n}

 if(z){$('#zn_').value=z.n;$('#zd').value=(z.dark||0)*100;$('#zc').value=z.col||'#150a3a';$('#zg').value=z.msg||'';$('#zr').checked=!!z.rep;$('#zcd').value=z.code||'';$('#zok').onclick=()=>{Object.assign(z,{n:$('#zn_').value||z.n,mus:$('#zm').value,dark:$('#zd').value/100,col:$('#zc').value,fl:$('#zf').value,msg:$('#zg').value,sc:$('#zs_').value,rep:$('#zr').checked,code:$('#zcd').value});ZI=-1;toast('Зона сохранена');renderZn()}}

/* --- файлы: экспорт, импорт, карта из картинки --- */
function pickFile(acc,cb){const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
function exportLoc(){const l=world.locs[me.l];if(!l){toast('Откройте обычную локацию');return}const b=new Blob([JSON.stringify({kind:'loc',loc:l,tiles:world.tiles})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(l.n||'location')+'.json';a.click()}
function importJson(f){return f.text().then(t=>{try{const o=JSON.parse(t),l=o.loc||o;if(!Array.isArray(l.rows)||!l.rows.length)throw 0;const id='l'+Date.now().toString(36);l.n=(l.n||'Импорт')+' (импорт)';l.portals={};if(o.tiles)for(const k in o.tiles)if(!world.tiles[k])world.tiles[k]=o.tiles[k];world.locs[id]=l;tp(id,l.sx||2,l.sy||2);toast('Локация импортирована')}catch(e){toast('Это не файл локации')}})}
const rgbOf=css=>{const c=document.createElement('canvas');c.width=c.height=1;const g=c.getContext('2d');g.fillStyle=css;g.fillRect(0,0,1,1);const d=g.getImageData(0,0,1,1).data;return[d[0],d[1],d[2]]};
async function importPic(f,mxs){const mx=mxs||Math.min(64,Math.max(8,+await ask('Макс. размер (8–64)',32)||32)),im=new Image();im.src=URL.createObjectURL(f);await new Promise(r=>im.onload=r);const k=Math.min(1,mx/Math.max(im.width,im.height)),w=Math.max(4,Math.round(im.width*k)),h=Math.max(4,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(im,0,0,w,h);const D=g.getImageData(0,0,w,h).data,pal=Object.keys(world.tiles).filter(q=>q!='6').map(q=>({c:q,v:rgbOf(colorOf(q))})),rows=[];let sx=1,sy=1,fd=0;
 for(let y=0;y<h;y++){let r='';for(let x=0;x<w;x++){const i=(y*w+x)*4;let best=pal[0],bd=1e9;for(const p of pal){const d=(p.v[0]-D[i])**2+(p.v[1]-D[i+1])**2+(p.v[2]-D[i+2])**2;if(d<bd){bd=d;best=p}}r+=best.c;if(!fd&&!(world.tiles[best.c]||{}).b&&!(world.tiles[best.c]||{}).dmg){fd=1;sx=x;sy=y}}rows.push(r)}
 const id='l'+Date.now().toString(36);world.locs[id]={n:(f.name||'Картинка').replace(/\.\w+$/,''),sx,sy,rows,portals:{},objs:[]};tp(id,sx+.5,sy+.5);toast('Карта из картинки: '+w+'×'+h)}
{const _rm=window.renderMx;window.renderMx=()=>{_rm();const a=$('#admb');a.insertAdjacentHTML('beforeend','<b>Файлы</b><button id="xe">⬇ Экспорт локации (JSON)</button><button id="xi">⬆ Импорт локации (JSON)</button><button id="xp">🖼 Карта из картинки</button><b>Проверка</b><button id="xt">▶ Играть здесь (тест)</button><small>В тесте предметы и квесты не сохраняются, а карта потом возвращается как была.</small>');
