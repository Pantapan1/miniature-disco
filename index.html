<script>

(()=>{
/* PCM -> 8-бит трек (12 строк = 12 нот одной октавы) */
async function audioToTrack(mono,sr,bpm,onp){
 const f=Math.max(1,Math.round(sr/11025)),n=Math.floor(mono.length/f),x=new Float32Array(n);
 for(let i=0;i<n;i++){let s=0;for(let j=0;j<f;j++)s+=mono[i*f+j];x[i]=s/f}

  if(u>=0)o.push(11-u);return o});

const MAXS=300;
